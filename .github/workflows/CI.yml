name: CI

on:
  pull_request:
    branches:
      - main
      - torch
  push:
    branches:
      - main
      - torch

jobs:
  # Pull requests: NumPy backend on Ubuntu, all supported Python versions
  test-pr:
    name: Test on Ubuntu (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --cov=RNUMPY --cov-report=xml --cov-config=.coveragerc -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: RCAIDE/RNUMPY
          flags: numpy

  # Pull requests and pushes: JAX and torch backends (their tests skip in the NumPy-only jobs)
  test-backends:
    name: Test JAX and torch backends
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install jax
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --cov=RNUMPY --cov-report=xml --cov-config=.coveragerc -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: RCAIDE/RNUMPY
          flags: backends

  # Pushes: NumPy backend on Ubuntu, macOS and Windows
  test-push:
    name: Test on Multiple OS (Push)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --cov=RNUMPY --cov-report=xml --cov-config=.coveragerc -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: RCAIDE/RNUMPY
          flags: numpy
